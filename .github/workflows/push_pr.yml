name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".*"
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flink-connector-oceanbase:
    uses: ./.github/workflows/test.yml
    with:
      module: flink-connector-oceanbase

  flink-connector-obkv-hbase:
    uses: ./.github/workflows/test.yml
    with:
      module: flink-connector-obkv-hbase

  flink-connector-obkv-hbase2:
    uses: ./.github/workflows/test.yml
    with:
      module: flink-connector-obkv-hbase2

  flink-connector-oceanbase-directload:
    uses: ./.github/workflows/test.yml
    with:
      module: flink-connector-oceanbase-directload

  flink-connector-oceanbase-cli:
    uses: ./.github/workflows/test.yml
    with:
      module: flink-connector-oceanbase-cli

  flink-connector-oceanbase-e2e-tests:
    strategy:
      matrix:
        flink_version: ["1.15.4", "1.16.3", "1.17.2", "1.18.1", "1.19.1", "1.20.0"]
    uses: ./.github/workflows/test.yml
    with:
      module: flink-connector-oceanbase-e2e-tests
      maven_opts: "-Dflink_version=${{ matrix.flink_version }}"

  flink-2-build:
    name: Flink ${{ matrix.flink_version }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flink_version: ["2.0.2", "2.1.3", "2.2.1", "2.3.0"]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'maven'

      - name: Build and test Flink ${{ matrix.flink_version }} artifacts
        run: >-
          mvn -pl flink-sql-connector-oceanbase-flink2,flink-sql-connector-oceanbase-directload-flink2
          -am clean package -Pflink-2
          -Dflink2.version=${{ matrix.flink_version }}
